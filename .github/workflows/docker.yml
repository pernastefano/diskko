name: CI / Docker

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q -n auto

  # The whole product in containers: DISKKO next to a mock Plex and a mock SLSKD (e2e/).
  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx

      - name: Start the stack
        run: docker compose -f e2e/docker-compose.yml up -d --build --wait --wait-timeout 180

      - name: Run the end-to-end checks
        run: python e2e/run_e2e.py

      - name: The container is healthy and runs as PUID/PGID, not root
        run: |
          test "$(docker inspect -f '{{.State.Health.Status}}' diskko-e2e)" = healthy
          test "$(docker exec diskko-e2e stat -c '%u:%g' /data/app.db)" = "1234:1234"
          docker top diskko-e2e -o user,pid,args | tee top.txt
          grep -q uvicorn top.txt
          ! awk '/uvicorn/ {print $1}' top.txt | grep -qx root

      - name: No secret in the logs
        run: |
          docker compose -f e2e/docker-compose.yml logs --no-color > logs.txt
          ! grep -E 'e2e-plex-token|e2e-slskd-key|e2e-secret-key' logs.txt

      - name: Logs on failure
        if: failure()
        run: docker compose -f e2e/docker-compose.yml logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose -f e2e/docker-compose.yml down -v

  build:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Smoke test: build for the runner arch, run it and hit /health.
      - name: Build (smoke test image)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: diskko:smoke
          cache-from: type=gha
      - name: Smoke test /health
        run: |
          docker run -d --name diskko-smoke -p 8000:8000 diskko:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs diskko-smoke
          exit 1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest on main, vX.Y.Z on tags, dev on every other branch.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern=v{{version}}
            type=raw,value=dev,enable=${{ github.ref_type == 'branch' && github.ref != 'refs/heads/main' }}

      - name: Build and push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
