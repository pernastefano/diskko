{# needs: artist. Rendered in the page header, and again (out of band) when the profile job ends. #}
<div id="artist-image" {% if oob %}hx-swap-oob="true"{% endif %} class="h-32 w-32 shrink-0 overflow-hidden rounded-lg bg-gradient-to-br from-slate-200 to-slate-300 sm:h-40 sm:w-40">
  {% if artist.image_url %}
    <img src="{{ artist.image_url|replace('250x250', '500x500') }}" alt="{{ artist.name }}" loading="lazy" referrerpolicy="no-referrer" class="h-full w-full object-cover" data-artist-image>
  {% else %}
    <div class="flex h-full w-full items-center justify-center text-4xl font-semibold text-slate-500" aria-hidden="true">{{ (artist.name[:1] or '')|upper }}</div>
  {% endif %}
</div>
