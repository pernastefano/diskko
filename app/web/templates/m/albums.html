{% extends "m/base.html" %}
{% block title %}{{ t('nav.albums') }}{% endblock %}
{% block content %}
<form method="get" action="/m/albums" class="mb-3" role="search" id="m-filter">
  <label for="mq" class="sr-only">{{ t('albums.search') }}</label>
  <input id="mq" name="q" type="search" value="{{ q }}" placeholder="{{ t('albums.search') }}" autocomplete="off"
         class="m-tap w-full rounded-lg border border-slate-300 px-3 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
         hx-get="/m/albums/items" hx-trigger="input changed delay:300ms, search" hx-target="#m-items" hx-swap="innerHTML" hx-include="#m-filter" hx-sync="this:replace">
</form>
<ul id="m-items" class="space-y-2" data-list="albums">{% include "m/_album_items.html" %}</ul>
{% endblock %}
