{% extends "base.html" %}
{% block title %}{{ t('error.title') }}{% endblock %}
{% block content %}

  <h1 class="text-2xl font-semibold">{{ t('error.title') }}</h1>
  <p class="mt-2 text-slate-600">{{ t('error.' ~ code) }}</p>

</div>
{% endblock %}
