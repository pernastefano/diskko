{% extends "base.html" %}
{% block title %}{{ t('nav.albums') }}{% endblock %}
{% block content %}
<div class="mb-4 flex flex-wrap items-baseline justify-between gap-2">
  <h1 class="text-2xl font-semibold">{{ t('nav.albums') }}</h1>
  <span class="text-sm text-slate-500" id="albums-total">{{ t('albums.count', n=total) }}</span>
</div>

<form id="filters" method="get" action="/albums" class="mb-4 flex flex-wrap items-end gap-3 text-sm" x-data>
  <div class="min-w-[12rem] flex-1">
    <label for="q" class="sr-only">{{ t('albums.search') }}</label>
    <input id="q" name="q" type="search" value="{{ p.q }}" placeholder="{{ t('albums.search') }}" autocomplete="off"
           class="w-full rounded-md border border-slate-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
           hx-get="/albums/items" hx-trigger="input changed delay:300ms, search" hx-target="#tiles" hx-swap="innerHTML"
           hx-include="#filters" hx-sync="this:replace">
  </div>
  <div>
    <label for="quality" class="block text-xs text-slate-500">{{ t('albums.quality') }}</label>
    <select id="quality" name="quality" @change="$el.form.submit()" class="rounded-md border border-slate-300 bg-white px-2 py-2">
      <option value="">{{ t('albums.any') }}</option>
      {% for pr in profiles %}<option value="{{ pr.key }}" {% if p.quality == pr.key %}selected{% endif %}>{{ pr.name }}</option>{% endfor %}
    </select>
  </div>
  <div>
    <label for="fmt" class="block text-xs text-slate-500">{{ t('albums.format') }}</label>
    <select id="fmt" name="fmt" @change="$el.form.submit()" class="rounded-md border border-slate-300 bg-white px-2 py-2">
      <option value="">{{ t('albums.any') }}</option>
      {% for f in formats %}<option value="{{ f }}" {% if p.fmt == f %}selected{% endif %}>{{ f|upper }}</option>{% endfor %}
    </select>
  </div>
  <div>
    <label for="category" class="block text-xs text-slate-500">{{ t('albums.type') }}</label>
    <select id="category" name="category" @change="$el.form.submit()" class="rounded-md border border-slate-300 bg-white px-2 py-2">
      <option value="">{{ t('albums.any') }}</option>
      {% for c in categories %}<option value="{{ c }}" {% if p.category == c %}selected{% endif %}>{{ t('category.' ~ c) }}</option>{% endfor %}
      <option value="unmatched" {% if p.category == 'unmatched' %}selected{% endif %}>{{ t('artist.unmatched_group') }}</option>
    </select>
  </div>
  <div>
    <label for="sort" class="block text-xs text-slate-500">{{ t('lib.sort') }}</label>
    <select id="sort" name="sort" @change="$el.form.submit()" class="rounded-md border border-slate-300 bg-white px-2 py-2">
      {% for s in sorts %}<option value="{{ s }}" {% if p.sort == s %}selected{% endif %}>{{ t('albums.sort.' ~ s) }}</option>{% endfor %}
    </select>
  </div>
  {% if p.filtered %}<a href="/albums" class="py-2 text-indigo-600 hover:underline">{{ t('albums.clear') }}</a>{% endif %}
  <noscript><button type="submit" class="rounded-md border border-slate-300 px-3 py-2">{{ t('action.filter') }}</button></noscript>
</form>

<div id="tiles" class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6">
  {% include "_album_items.html" %}
</div>
{% endblock %}
