[project]
name = "diskko"
version = "0.3.0"
description = "Music library manager: missing albums, SLSKD downloads, tagging, Plex rescan"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "data", "music-test", "downloads-test"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"e2e/**" = ["E501"]
"tests/*" = ["E501"]  # long XML/fixture strings

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
